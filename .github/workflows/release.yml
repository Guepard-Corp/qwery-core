name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

# simple-git-hooks' postinstall crashes under Bun's nested store layout on a fresh
# CI install; git hooks are irrelevant here, so skip its install entirely.
env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each tarball is built on its own native runner — the DuckDB native
          # addon cannot be cross-compiled (ADR #36). build-release.ts detects
          # the host and emits qwery-<os>-<arch>.tar.gz accordingly.
          - platform: macos-aarch64
            os: macos-14
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: linux-aarch64
            os: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - run: bun install --frozen-lockfile
      - name: Build release tarball
        run: bun run build:release
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.platform }}
          path: dist-release/qwery-*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout (for the install script)
        uses: actions/checkout@v4
      - name: Download all tarballs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: qwery ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # The install script is shipped as an asset so the docs URL
          # `releases/latest/download/install` resolves.
          files: |
            artifacts/**/*.tar.gz
            install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
