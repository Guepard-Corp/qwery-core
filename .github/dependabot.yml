version: 2
updates:
  # JS/TS dependencies (Bun reads package.json; the npm ecosystem updates it).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    # Conventional Commits — commitlint rejects emoji prefixes.
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Major bumps need manual review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
